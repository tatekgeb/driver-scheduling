[phases.setup]
nixPkgs = ["nodejs-18_x", "python312"]

[phases.install]
cmds = [
  "python3 -m pip install --upgrade pip setuptools wheel",
  "python3 -m pip install --user -r requirements.txt",
  "cd desktop && npm install",
  "cd desktop && npm run build:react"
]

[phases.build]
cmds = ["echo 'Build complete'"]

[start]
cmd = "python3 -m pip install -r requirements.txt && cd api && python3 app.py"

